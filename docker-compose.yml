name: evaluacion-replica

services:
  server:
    image: evaluacion-replica-server
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4003:4001"
    env_file:
      - ./server/.env.production
    environment:
      # `localhost` dentro del contenedor es el mismo servidor Node, no FastAPI.
      PATH_SERVAPLICACIONES: fastapi_backend
    volumes:
      - ./server/resultados:/app/server/resultados
      - ./server/audios:/app/server/audios
      - speech-jobs:/data/jobs
    depends_on:
      fastapi_backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  fastapi_backend:
    image: evaluacion-replica-fastapi
    build:
      context: ./fastapi
    ports:
      - "8002:8000"
    env_file:
      - ./server/.env.production
    environment:
      DEVICE: "cpu"
      MODEL_SIZE: "medium"
      COMPUTE_TYPE: "int8"
      HF_AUTH_TOKEN: "${HF_AUTH_TOKEN:?Define HF_AUTH_TOKEN in .env}"
      JOB_STORAGE: /data/jobs
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    volumes:
      - speech-jobs:/data/jobs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5

  fastapi_worker:
    image: evaluacion-replica-fastapi
    # Comparte la misma imagen con la API; al declarar build no se intenta
    # descargar `cyc_calidad-fastapi` desde Docker Hub.
    build:
      context: ./fastapi
    env_file:
      - ./server/.env.production
    environment:
      DEVICE: "cpu"
      MODEL_SIZE: "medium"
      COMPUTE_TYPE: "int8"
      HF_AUTH_TOKEN: "${HF_AUTH_TOKEN:?Define HF_AUTH_TOKEN in .env}"
      JOB_STORAGE: /data/jobs
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      HF_HOME: /root/.cache/huggingface
      TORCH_HOME: /root/.cache/torch
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=INFO", "--concurrency=1", "--prefetch-multiplier=1"]
    volumes:
      - speech-jobs:/data/jobs
      - huggingface-cache:/root/.cache/huggingface
      - torch-cache:/root/.cache/torch
    depends_on:
      redis:
        condition: service_healthy

volumes:
  speech-jobs:
  redis-data:
  huggingface-cache:
  torch-cache:

